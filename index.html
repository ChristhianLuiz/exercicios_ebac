<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/main.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <title>Bootstrap</title>
</head>
<body>
    <div class="container">

        <div class="row">
            <div class="col">
                <h2>Entre em contato</h2>
                <form>
                    <label class="form-label" for="nome">Seu nome:</label>
                    <input class="form-control form-control-sm" type="text" id="nome" />

                    <label class="form-label" for="email">E-mail:</label>
                    <input class="form-control form-control-sm" type="email" id="email">

                    <label class="form-label" for="telefone">Telefone:</label>
                    <input class="form-control form-control-sm" type="tel" id="telefone">
                    <button class="btn btn-primary b">Enviar</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
